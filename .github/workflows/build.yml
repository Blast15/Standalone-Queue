name: Build & Release

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name for release (ví dụ: v2.0.0)"
        required: false
        default: "v2.0.0"
      draft:
        description: "Tạo bản nháp (Draft Release)?"
        type: boolean
        default: false
      prerelease:
        description: "Đánh dấu là bản thử nghiệm (Pre-release)?"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build & Package JAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build with Maven
        run: mvn -B clean install --file pom.xml

      - name: Build Paper staging probe
        run: mvn -B clean verify --file staging-probe/pom.xml

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: StandaloneQueue-Test-Reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore

      - name: Upload Staging Probe
        uses: actions/upload-artifact@v4
        with:
          name: StandaloneQueue-StagingProbe
          path: staging-probe/target/StandaloneQueue-StagingProbe-*.jar
          if-no-files-found: error

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: StandaloneQueue-Jar
          path: target/StandaloneQueue-*.jar
          if-no-files-found: error

  java-compatibility:
    name: Unit and API integration on Java 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
      - run: mvn -B clean verify

  paper-staging:
    name: Paper ${{ matrix.minecraft }} network and recovery
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: '1.21.11'
            java: '21'
          - minecraft: '26.1.1'
            java: '25'
          - minecraft: '26.1.2'
            java: '25'
          - minecraft: '26.2'
            java: '25'
          - minecraft: '26.3'
            java: '25'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: scripts/staging/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: StandaloneQueue-Jar
          path: target
      - uses: actions/download-artifact@v4
        with:
          name: StandaloneQueue-StagingProbe
          path: staging-probe/target
      - name: Prepare isolated EULA-accepted test runtime
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix scripts/staging
          node scripts/staging/check-client.mjs
          python3 scripts/staging/prepare.py --version '${{ matrix.minecraft }}' --allow-unstable --accept-eula --prepare-only
      - name: Network lifecycle, bans, restart, SIGKILL and corrupt snapshot
        run: python3 scripts/staging/smoke.py --version '${{ matrix.minecraft }}'
      - name: 500 waiting / 50 online real clients
        if: matrix.minecraft == '26.2'
        run: |
          python3 scripts/staging/prepare.py --version '26.2' --runtime .staging-work/load-26.2 --accept-eula --prepare-only
          python3 scripts/staging/smoke.py --version '26.2' --runtime .staging-work/load-26.2 --load --soak-seconds 300
      - name: Real LuckPerms H2 and online authentication boundary
        run: |
          python3 scripts/staging/prepare.py --version '${{ matrix.minecraft }}' --runtime '.staging-work/lp-${{ matrix.minecraft }}' --allow-unstable --accept-eula --prepare-only
          python3 scripts/staging/luckperms.py --version '${{ matrix.minecraft }}' --runtime '.staging-work/lp-${{ matrix.minecraft }}'
      - name: Encrypted online pipeline with real LuckPerms and mock session
        if: matrix.minecraft == '1.21.11'
        run: |
          python3 scripts/staging/prepare.py --version '1.21.11' --runtime '.staging-work/online-1.21.11' --accept-eula --prepare-only
          python3 scripts/staging/online.py --version '1.21.11' --runtime '.staging-work/online-1.21.11'
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Paper-${{ matrix.minecraft }}-Evidence
          path: |
            .staging-work/**/smoke-*
            .staging-work/**/raw-protocol-map.json
            .staging-work/**/paper-source.json
            .staging-work/**/luckperms-*.json
          include-hidden-files: true
          if-no-files-found: error

  release:
    name: Publish only after compatibility checks
    needs: [build, java-compatibility, paper-staging]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release 2.0.0]'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag_name || (github.ref == 'refs/heads/main' && 'v2.0.0') || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: StandaloneQueue-Jar
          path: target

      - name: Select version release notes
        id: release_notes
        run: |
          python3 - <<'PYTHON'
          import os, re
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          if re.fullmatch(r'v[0-9]+[.][0-9]+[.][0-9]+', tag):
              source = Path('docs/releases') / (tag[1:] + '.md')
              if source.is_file():
                  with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                      output.write(f'body_path={source}\n')
          PYTHON

      - uses: actions/download-artifact@v4
        with:
          pattern: Paper-*-Evidence
          path: release-evidence
      - name: Package test evidence and checksums
        run: |
          tar -czf target/StandaloneQueue-2.0.0-test-evidence.tar.gz -C release-evidence .
          python3 - <<'PYTHON'
          import hashlib, os, zipfile
          from pathlib import Path
          jars = list(Path('target').glob('StandaloneQueue-*.jar'))
          if len(jars) != 1 or jars[0].name != 'StandaloneQueue-2.0.0.jar':
              raise SystemExit('Expected one production 2.0.0 JAR')
          with zipfile.ZipFile(jars[0]) as archive:
              if 'version: 2.0.0' not in archive.read('plugin.yml').decode():
                  raise SystemExit('Incorrect plugin descriptor')
          files = jars + list(Path('target').glob('*-test-evidence.tar.gz'))
          Path('target/SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name + '\n' for p in files))
          Path('target/BUILD-PROVENANCE.txt').write_text('commit=' + os.environ['GITHUB_SHA'] + '\nci=https://github.com/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID'] + '\n')
          PYTHON

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/StandaloneQueue-*.jar
            target/StandaloneQueue-*-test-evidence.tar.gz
            target/SHA256SUMS
            target/BUILD-PROVENANCE.txt
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: StandaloneQueue ${{ env.RELEASE_TAG }}
          body_path: ${{ steps.release_notes.outputs.body_path }}
          generate_release_notes: true
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
