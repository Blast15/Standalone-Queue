name: Build & Release

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name for release (ví dụ: v2.0.0)"
        required: false
        default: "v2.0.0"
      draft:
        description: "Tạo bản nháp (Draft Release)?"
        type: boolean
        default: false
      prerelease:
        description: "Đánh dấu là bản thử nghiệm (Pre-release)?"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build & Package JAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build with Maven
        run: mvn -B clean install --file pom.xml

      - name: Build Paper staging probe
        run: mvn -B clean verify --file staging-probe/pom.xml

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: StandaloneQueue-Test-Reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore

      - name: Upload Staging Probe
        uses: actions/upload-artifact@v4
        with:
          name: StandaloneQueue-StagingProbe
          path: staging-probe/target/StandaloneQueue-StagingProbe-*.jar
          if-no-files-found: error

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: StandaloneQueue-Jar
          path: target/StandaloneQueue-*.jar
          if-no-files-found: error

      - name: Select version release notes
        id: release_notes
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag_name || github.ref_name }}
        run: |
          python3 - <<'PYTHON'
          import os, re
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          if re.fullmatch(r'v[0-9]+[.][0-9]+[.][0-9]+', tag):
              source = Path('docs/releases') / (tag[1:] + '.md')
              if source.is_file():
                  with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                      output.write(f'body_path={source}\n')
          PYTHON

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: target/StandaloneQueue-*.jar
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: StandaloneQueue ${{ github.event.inputs.tag_name || github.ref_name }}
          body_path: ${{ steps.release_notes.outputs.body_path }}
          generate_release_notes: true
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
