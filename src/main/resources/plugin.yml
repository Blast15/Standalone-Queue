name: StandaloneQueue
version: 1.2.0-SNAPSHOT
softdepend: [LuckPerms]
main: com.mineplugin.queue.StandaloneQueuePlugin
api-version: '1.21'
author: BlastSama
description: Plugin hang cho tu dong khong can proxy cho may chu Paper

commands:
  queue:
    description: Cac lenh quan tri he thong hang cho
    usage: /<command> [reload|status|stats|inspect|pause|resume|move|list|clear|kick|antibot]
    aliases: [sq, hangcho]

permissions:
  queue.admin:
    description: Toan quyen quan tri hang cho
    default: op
  queue.inspect:
    description: Xem chi tiet hang cho, khong hien IP
    default: op
  queue.stats:
    description: Xem thong ke va trang thai
    default: op
  queue.manage:
    description: Pause, resume, move, clear va kick
    default: op
  queue.bypass:
    description: Bo qua hang cho va vao thang may chu ngay ca khi full
    default: op
  queue.priority:
    description: Uu tien hang cho co ban
    default: false
  queue.priority.vip:
    description: Uu tien hang cho VIP cao cap
    default: false
